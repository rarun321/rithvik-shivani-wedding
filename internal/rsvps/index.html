<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSVPs — Internal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; }

  /* --- Auth gate --- */
  #gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .gate-box {
    background: #fff; border-radius: 12px; padding: 2.5rem 2rem;
    box-shadow: 0 4px 24px rgba(0,0,0,.1); width: 100%; max-width: 360px; text-align: center;
  }
  .gate-box h1 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #444; }
  .gate-box input {
    width: 100%; padding: .75rem 1rem; border: 1px solid #ddd;
    border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; outline: none;
  }
  .gate-box input:focus { border-color: #888; }
  .gate-box button {
    width: 100%; padding: .75rem; background: #23150a; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
  }
  .gate-box button:hover { background: #3a2318; }
  .gate-error { color: #c00; font-size: .875rem; margin-top: .5rem; }

  /* --- Dashboard --- */
  #dashboard { display: none; padding: 2rem; }
  h1.title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.75rem; color: #23150a; }

  /* Stats */
  .stats { display: flex; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
  .stat {
    background: #fff; border-radius: 10px; padding: 1.1rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.07); flex: 1; min-width: 140px;
  }
  .stat-val { font-size: 2rem; font-weight: 700; color: #23150a; }
  .stat-label { font-size: .8rem; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-top: .2rem; }

  /* Filters */
  .filters {
    background: #fff; border-radius: 10px; padding: 1.1rem 1.25rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.07); margin-bottom: 1.25rem;
    display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end;
  }
  .filters input, .filters select {
    padding: .5rem .85rem; border: 1px solid #ddd; border-radius: 7px;
    font-size: .9rem; outline: none; background: #fafafa;
  }
  .filters input:focus, .filters select:focus { border-color: #888; }
  .filter-group { display: flex; flex-direction: column; gap: .25rem; }
  .filter-group label { font-size: .8rem; color: #888; white-space: nowrap; }
  .filters input[type="text"] { min-width: 180px; }
  .count-label { font-size: .85rem; color: #888; padding-bottom: .5rem; }
  .refresh-btn {
    padding: .5rem 1rem; background: #23150a; color: #fff;
    border: none; border-radius: 7px; font-size: .85rem; cursor: pointer; margin-left: auto;
  }
  .refresh-btn:hover { background: #3a2318; }

  /* Table */
  .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  thead th {
    text-align: left; padding: .85rem 1rem; font-size: .72rem;
    text-transform: uppercase; letter-spacing: .07em; color: #888;
    border-bottom: 1px solid #eee; white-space: nowrap; background: #fafafa;
  }
  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  tbody td { padding: .75rem 1rem; vertical-align: middle; }

  /* Badges */
  .badge {
    display: inline-block; padding: .2rem .55rem; border-radius: 5px;
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  }
  .badge-both    { background: #e8f4e8; color: #2a6b2a; }
  .badge-hyd     { background: #fff3e0; color: #a35c00; }
  .badge-chennai { background: #e8eeff; color: #2a3fbf; }
  .badge-full    { background: #f3e8ff; color: #6a2abf; }
  .badge-sangeet { background: #fff0f6; color: #b02070; }

  /* Inline edit shared */
  .editable-cell { display: flex; align-items: center; gap: .35rem; }
  .editable-val {
    cursor: pointer; border-bottom: 1px dashed #bbb; white-space: nowrap;
  }
  .editable-val:hover { border-bottom-color: #555; }
  .edit-input {
    padding: .2rem .4rem; border: 1px solid #bbb; border-radius: 5px; font-size: .875rem;
  }
  .edit-input[type="number"] { width: 60px; text-align: center; }
  .edit-input[type="text"]   { width: 150px; }
  .edit-select { padding: .2rem .4rem; border: 1px solid #bbb; border-radius: 5px; font-size: .875rem; }
  .save-btn {
    padding: .2rem .55rem; font-size: .75rem; background: #23150a; color: #fff;
    border: none; border-radius: 5px; cursor: pointer; white-space: nowrap;
  }
  .save-btn:hover { background: #3a2318; }
  .save-btn:disabled { opacity: .5; cursor: not-allowed; }
  .cancel-btn {
    padding: .2rem .5rem; font-size: .75rem; background: none;
    border: 1px solid #ccc; border-radius: 5px; cursor: pointer; color: #666;
  }
  .cancel-btn:hover { border-color: #888; }

  /* Checkbox */
  .transport-cb { width: 16px; height: 16px; cursor: pointer; accent-color: #23150a; }

  /* Delete */
  .del-btn {
    padding: .3rem .7rem; font-size: .75rem; border: 1px solid #e0b0b0;
    background: #fff5f5; color: #c00; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .del-btn:hover { background: #fde8e8; }
  .del-btn:disabled { opacity: .5; cursor: not-allowed; }

  .empty { padding: 3rem; text-align: center; color: #aaa; }
  .loading-row td { text-align: center; color: #aaa; padding: 3rem; }

  /* --- Tabs --- */
  .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e8e8e8; }
  .tab-btn {
    padding: .65rem 1.4rem; font-size: .9rem; font-weight: 500; border: none;
    background: none; cursor: pointer; color: #888; border-bottom: 2px solid transparent;
    margin-bottom: -2px; transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: #444; }
  .tab-btn.active { color: #23150a; border-bottom-color: #23150a; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* --- Accommodation tab --- */
  .hotel-tabs-bar {
    display: flex; gap: 0; margin-bottom: 1.5rem;
    background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07);
    overflow: hidden; border: 1px solid #ebe8e5;
  }
  .hotel-tab-btn {
    flex: 1; padding: 1rem .75rem; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: .25rem;
    border-right: 1px solid #ebe8e5; transition: background .15s;
    position: relative;
  }
  .hotel-tab-btn:last-child { border-right: none; }
  .hotel-tab-btn:hover { background: #fdf9f7; }
  .hotel-tab-btn.active { background: #23150a; }
  .hotel-tab-btn.active::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: #23150a;
    top: 100%;
  }
  .hotel-tab-name {
    font-size: .82rem; font-weight: 600; color: #444; line-height: 1.3; text-align: center;
  }
  .hotel-tab-btn.active .hotel-tab-name { color: #fff; }
  .hotel-tab-stats { display: flex; gap: .85rem; margin-top: .15rem; }
  .hotel-tab-stat { text-align: center; }
  .hotel-tab-stat-val { font-size: 1.15rem; font-weight: 700; color: #23150a; line-height: 1; }
  .hotel-tab-btn.active .hotel-tab-stat-val { color: #f5e9d8; }
  .hotel-tab-stat-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .06em; color: #aaa; }
  .hotel-tab-btn.active .hotel-tab-stat-label { color: rgba(255,255,255,.55); }

  .hotel-content { display: none; }
  .hotel-content.active { display: block; }
  .hotel-content-inner {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start;
  }
  @media (max-width: 900px) { .hotel-content-inner { grid-template-columns: 1fr; } }

  .rooms-column { display: block; }
  .rooms-scroll-area { overflow-y: auto; max-height: 60vh; }
  .rooms-scroll-area::-webkit-scrollbar { width: 5px; }
  .rooms-scroll-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

  .unassigned-panel {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); overflow: hidden;
  }
  .unassigned-panel-header {
    padding: .85rem 1.25rem; background: #f5f5f5; border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
  }
  .unassigned-panel-body { overflow-y: auto; max-height: 60vh; }
  .unassigned-panel-body::-webkit-scrollbar { width: 5px; }
  .unassigned-panel-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  .unassigned-panel-title { font-size: .9rem; font-weight: 600; color: #555; }
  .unassigned-panel-count { font-size: .8rem; color: #888; }

  /* standalone unassigned-card (no hotel at all) */
  .hotel-grid { display: none; }
  .hotel-card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07);
    overflow: hidden;
  }
  .hotel-header {
    padding: 1rem 1.25rem; background: #23150a; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hotel-name { font-size: 1rem; font-weight: 600; }
  .hotel-meta { display: flex; gap: 1.25rem; }
  .hotel-stat { text-align: center; }
  .hotel-stat-val { font-size: 1.4rem; font-weight: 700; }
  .hotel-stat-label { font-size: .7rem; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
  .hotel-body { padding: .5rem 0; }
  .hotel-empty { padding: 1.5rem; text-align: center; color: #bbb; font-size: .875rem; }

  /* Room sections */
  .room-section { margin: .5rem .75rem; border: 1px solid #eee; border-radius: 9px; overflow: hidden; }
  .room-header {
    display: flex; align-items: center; gap: .5rem; padding: .55rem .85rem;
    background: #f9f6f3; border-bottom: 1px solid #eee;
  }
  .room-label-val {
    flex: 1; font-weight: 600; font-size: .875rem; color: #23150a;
    cursor: pointer; border-bottom: 1px dashed transparent;
  }
  .room-label-val:hover { border-bottom-color: #bbb; }
  .room-label-input {
    flex: 1; padding: .2rem .4rem; border: 1px solid #bbb;
    border-radius: 5px; font-size: .875rem; font-weight: 600;
  }
  .room-del-btn {
    padding: .2rem .55rem; font-size: .72rem; border: 1px solid #e0b0b0;
    background: #fff5f5; color: #c00; border-radius: 5px; cursor: pointer;
  }
  .room-del-btn:hover { background: #fde8e8; }
  .room-guests-list { padding: .25rem 0; }
  .room-guest-row {
    display: flex; align-items: center; gap: .5rem; padding: .45rem .85rem;
    border-bottom: 1px solid #f5f5f5; font-size: .85rem;
  }
  .room-guest-row:last-child { border-bottom: none; }
  .room-guest-name { flex: 1; }
  .room-guest-detail { color: #888; font-size: .78rem; white-space: nowrap; }
  .remove-from-room {
    padding: .15rem .45rem; font-size: .72rem; border: 1px solid #ddd;
    background: #fafafa; border-radius: 4px; cursor: pointer; color: #888;
    line-height: 1;
  }
  .remove-from-room:hover { border-color: #c00; color: #c00; background: #fff5f5; }

  /* Add Room button */
  .add-room-row { padding: .6rem .85rem; }
  .add-room-btn {
    font-size: .82rem; padding: .3rem .75rem; border: 1px dashed #bbb;
    border-radius: 6px; background: none; cursor: pointer; color: #666;
    width: 100%;
  }
  .add-room-btn:hover { border-color: #23150a; color: #23150a; background: #fdf9f7; }

  /* Unassigned-at-hotel section */
  .hotel-unassigned { border-top: 1px solid #f0f0f0; margin-top: .5rem; }
  .unassigned-section-label {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
    color: #aaa; padding: .55rem .85rem .2rem; font-weight: 600;
  }
  .unassigned-guest-row {
    display: flex; align-items: center; gap: .5rem; padding: .45rem .85rem;
    border-bottom: 1px solid #f5f5f5; font-size: .85rem;
  }
  .unassigned-guest-row:last-child { border-bottom: none; }
  .unassigned-guest-name { flex: 1; }
  .assign-select {
    font-size: .78rem; padding: .2rem .4rem; border: 1px solid #ddd;
    border-radius: 5px; background: #fafafa; cursor: pointer; max-width: 160px;
  }
  .assign-select:focus { outline: none; border-color: #888; }

  /* Family radio buttons */
  .family-radios { display: flex; gap: .35rem; align-items: center; }
  .family-radio-label {
    display: flex; align-items: center; gap: .2rem; cursor: pointer;
    font-size: .75rem; padding: .15rem .4rem; border-radius: 4px;
    border: 1px solid #e0e0e0; white-space: nowrap; user-select: none;
  }
  .family-radio-label input { display: none; }
  .family-radio-label.selected-N { background: #e8f0ff; border-color: #4a6abf; color: #1a3a8f; font-weight: 600; }
  .family-radio-label.selected-R { background: #fff3e8; border-color: #bf7a2a; color: #8f4a00; font-weight: 600; }
  .family-badge {
    display: inline-block; padding: .15rem .45rem; border-radius: 4px;
    font-size: .72rem; font-weight: 600; white-space: nowrap;
  }
  .family-badge-N { background: #e8f0ff; color: #1a3a8f; }
  .family-badge-R { background: #fff3e8; color: #8f4a00; }

  /* Cannot attend */
  tr.cannot-attend td { opacity: .45; }
  tr.cannot-attend td:first-child::before {
    content: '✗ '; color: #c00; font-weight: 700;
  }
  .cant-cb { width: 16px; height: 16px; cursor: pointer; accent-color: #c00; }

  /* Stats family toggle */
  .stats-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
  .stats-header-label { font-size: .8rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; }
  .family-toggle { display: flex; gap: 0; border: 1px solid #e0e0e0; border-radius: 7px; overflow: hidden; }
  .family-toggle-btn {
    padding: .3rem .85rem; font-size: .8rem; border: none; background: none;
    cursor: pointer; color: #888; transition: background .12s, color .12s;
  }
  .family-toggle-btn:not(:last-child) { border-right: 1px solid #e0e0e0; }
  .family-toggle-btn:hover { background: #f5f5f5; }
  .family-toggle-btn.active { background: #23150a; color: #fff; font-weight: 600; }
  .family-toggle-btn.active-N { background: #1a3a8f; color: #fff; font-weight: 600; }
  .family-toggle-btn.active-R { background: #8f4a00; color: #fff; font-weight: 600; }

  /* Add RSVP Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 2rem;
    width: 100%; max-width: 480px; box-shadow: 0 8px 40px rgba(0,0,0,.18);
    max-height: 90vh; overflow-y: auto;
  }
  .modal-box h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; color: #23150a; }
  .modal-field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
  .modal-field label { font-size: .8rem; color: #888; text-transform: uppercase; letter-spacing: .05em; }
  .modal-field input, .modal-field select {
    padding: .55rem .85rem; border: 1px solid #ddd; border-radius: 8px;
    font-size: .9rem; outline: none; background: #fafafa;
  }
  .modal-field input:focus, .modal-field select:focus { border-color: #888; }
  .modal-accom { display: flex; flex-direction: column; gap: .35rem; }
  .modal-accom label { display: flex; align-items: center; gap: .5rem; font-size: .875rem; cursor: pointer; }
  .modal-footer { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }
  .modal-cancel {
    padding: .55rem 1.2rem; background: none; border: 1px solid #ddd;
    border-radius: 8px; font-size: .9rem; cursor: pointer; color: #666;
  }
  .modal-cancel:hover { border-color: #888; }
  .modal-submit {
    padding: .55rem 1.4rem; background: #23150a; color: #fff;
    border: none; border-radius: 8px; font-size: .9rem; cursor: pointer;
  }
  .modal-submit:hover { background: #3a2318; }
  .modal-submit:disabled { opacity: .5; cursor: not-allowed; }

  /* Global unassigned card (no hotel at all) */
  .unassigned-card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07);
    margin-top: 1.25rem; overflow: hidden;
  }
  .unassigned-header {
    padding: 1rem 1.25rem; background: #888; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hotel-guest-row {
    display: flex; align-items: center; gap: .75rem; padding: .6rem 1.25rem;
    border-bottom: 1px solid #f5f5f5; font-size: .875rem;
  }
  .hotel-guest-row:last-child { border-bottom: none; }
  .hotel-guest-name { flex: 1; font-weight: 500; }
  .hotel-guest-detail { color: #888; font-size: .8rem; white-space: nowrap; }
</style>
</head>
<body>

<!-- Auth gate -->
<div id="gate">
  <div class="gate-box">
    <h1>RSVP Dashboard</h1>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password">
    <button id="pwBtn">Enter</button>
    <p class="gate-error" id="pwErr"></p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <h1 class="title">Rithvik &amp; Shivani — RSVPs</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('rsvps')">RSVPs</button>
    <button class="tab-btn" onclick="switchTab('accommodation')">Accommodation</button>
  </div>

  <!-- Tab: RSVPs -->
  <div class="tab-panel active" id="tab-rsvps">

  <!-- Stats -->
  <div class="stats-header">
    <span class="stats-header-label">Overview</span>
    <div class="family-toggle">
      <button class="family-toggle-btn active" id="ftAll" onclick="setStatFamily('')">All</button>
      <button class="family-toggle-btn" id="ftN" onclick="setStatFamily('Narahari')">Narahari</button>
      <button class="family-toggle-btn" id="ftR" onclick="setStatFamily('Rajaraman')">Rajaraman</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statTotal">—</div><div class="stat-label">Responses</div></div>
    <div class="stat"><div class="stat-val" id="statGuests">—</div><div class="stat-label">Total Guests</div></div>
    <div class="stat"><div class="stat-val" id="statHyd">—</div><div class="stat-label">Hyderabad</div></div>
    <div class="stat"><div class="stat-val" id="statChe">—</div><div class="stat-label">Chennai</div></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label for="searchInput">Search name</label>
      <input type="text" id="searchInput" placeholder="Type a name…">
    </div>
    <div class="filter-group">
      <label for="filterEvents">Events</label>
      <select id="filterEvents">
        <option value="">All events</option>
        <option value="both">Both</option>
        <option value="hyderabad">Hyderabad</option>
        <option value="chennai">Chennai</option>
        <option value="sangeet">Sangeet</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filterAttending">Attending</label>
      <select id="filterAttending">
        <option value="">All</option>
        <option value="attending">Attending</option>
        <option value="cannot">Cannot Attend</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filterRelation">Relation</label>
      <select id="filterRelation">
        <option value="">All</option>
        <option value="Family">Family</option>
        <option value="Friends">Friends</option>
        <option value="Colleague">Colleague</option>
        <option value="__none__">Not assigned</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filterFamily">Family</label>
      <select id="filterFamily">
        <option value="">All</option>
        <option value="Narahari">Narahari</option>
        <option value="Rajaraman">Rajaraman</option>
        <option value="__none__">Not assigned</option>
      </select>
    </div>
    <div class="filter-group" style="position:relative">
      <label>Accommodation</label>
      <button type="button" id="accomDropBtn" onclick="toggleAccomDrop()" style="padding:.5rem .85rem;border:1px solid #ddd;border-radius:7px;font-size:.9rem;background:#fafafa;cursor:pointer;text-align:left;min-width:180px">All accommodation ▾</button>
      <div id="accomDrop" style="display:none;position:absolute;top:100%;left:0;z-index:100;background:#fff;border:1px solid #ddd;border-radius:8px;padding:.6rem .8rem;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:220px;margin-top:.25rem;display:none;flex-direction:column;gap:.4rem">
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;cursor:pointer"><input type="checkbox" value="__none__" class="accom-filter-cb" onchange="applyFilters()"> None assigned</label>
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;cursor:pointer"><input type="checkbox" value="Sheraton" class="accom-filter-cb" onchange="applyFilters()"> Sheraton</label>

async function loadRSVPs() {

// --- Stats ---
let statFamilyFilter = '';

function setStatFamily(fam) {
  statFamilyFilter = fam;
  document.getElementById('ftAll').className = 'family-toggle-btn' + (fam === '' ? ' active' : '');
  document.getElementById('ftN').className   = 'family-toggle-btn' + (fam === 'Narahari'  ? ' active-N' : '');
  document.getElementById('ftR').className   = 'family-toggle-btn' + (fam === 'Rajaraman' ? ' active-R' : '');
  renderStats(allRows);
}

function renderStats(rows) {
  const filtered = statFamilyFilter ? rows.filter(r => r.family === statFamilyFilter) : rows;
  const guests = filtered.reduce((s, r) => s + (+r.guests || 0), 0);
  const hyd = filtered.filter(r => r.events === 'hyderabad' || r.events === 'both').reduce((s, r) => s + (+r.guests || 0), 0);
  const che = filtered.filter(r => r.events === 'chennai'   || r.events === 'both').reduce((s, r) => s + (+r.guests || 0), 0);
  document.getElementById('statTotal').textContent  = filtered.length;
  document.getElementById('statGuests').textContent = guests;
  document.getElementById('statHyd').textContent    = hyd;
  document.getElementById('statChe').textContent    = che;
}

// --- Filters ---
function applyFilters() {
  const search    = document.getElementById('searchInput').value.toLowerCase();
  const evFilt    = document.getElementById('filterEvents').value;
  const relationFilt = document.getElementById('filterRelation').value;
  const famFilt      = document.getElementById('filterFamily').value;
  const attendFilt   = document.getElementById('filterAttending').value;
  const accomFilts = [...document.querySelectorAll('.accom-filter-cb:checked')].map(cb => cb.value);

  const filtered = allRows.filter(r => {
    if (search && !r.name?.toLowerCase().includes(search)) return false;
    if (evFilt && r.events !== evFilt) return false;
    if (relationFilt === '__none__' && r.relation) return false;
    if (relationFilt && relationFilt !== '__none__' && r.relation !== relationFilt) return false;
    if (famFilt === '__none__' && r.family) return false;
    if (famFilt && famFilt !== '__none__' && r.family !== famFilt) return false;
    if (attendFilt === 'attending' && r.cannot_attend) return false;
    if (attendFilt === 'cannot' && !r.cannot_attend) return false;
    if (accomFilts.length) {
      const hasNone  = accomFilts.includes('__none__');
      const venues   = accomFilts.filter(v => v !== '__none__');
      const rowEmpty = !r.accommodation || r.accommodation.length === 0 || r.accommodation.every(v => !v);
      const matchNone  = hasNone && rowEmpty;
      const matchVenue = venues.length > 0 && venues.some(v => r.accommodation?.includes(v));
      if (!matchNone && !matchVenue) return false;
    }
    return true;
  });

  document.getElementById('countLabel').textContent =
    filtered.length === allRows.length ? `${allRows.length} responses` : `${filtered.length} of ${allRows.length}`;

  if (!filtered.length) {
    setTbody('<tr><td colspan="13" class="empty">No matching responses.</td></tr>');
    return;
  }

  setTbody(filtered.map((r, i) => buildRow(r, i + 1)).join(''));
}

['searchInput','filterEvents','filterRelation','filterFamily','filterAttending'].forEach(id =>
  document.getElementById(id).addEventListener('input', applyFilters)
);

function toggleAccomDrop() {
  const drop = document.getElementById('accomDrop');

    document.getElementById('accomDrop').style.display = 'none';

function updateAccomBtn() {
  const checked = [...document.querySelectorAll('.accom-filter-cb:checked')].map(cb => cb.parentElement.textContent.trim());
  document.getElementById('accomDropBtn').textContent =
    checked.length === 0 ? 'All accommodation ▾' : checked.join(', ') + ' ▾';
}
document.querySelectorAll('.accom-filter-cb').forEach(cb => cb.addEventListener('change', () => { updateAccomBtn(); applyFilters(); }));

function buildRow(r, i) {
  const date = r.created_at
    ? new Date(r.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
    : '—';
  const accomDisplay = r.accommodation?.length
    ? r.accommodation.map(a => `<span style="background:#f0f0f0;padding:.1rem .4rem;border-radius:4px;font-size:.78rem;white-space:nowrap">${esc(a)}</span>`).join(' ')
    : '<span style="color:#bbb">—</span>';
  return `<tr data-id="${r.id}" class="${r.cannot_attend ? 'cannot-attend' : ''}">`+`
    <td style="color:#aaa">${i}</td>
    <td><div class="editable-cell" id="nc-${r.id}"><span class="editable-val" onclick="editName(${r.id})">${esc(r.name)}</span></div></td>
    <td><div class="editable-cell" id="pc-${r.id}"><span class="editable-val" onclick="editPhone(${r.id})">${r.phone ? esc(r.phone) : '<span style="color:#bbb">—</span>'}</span></div></td>
    <td><div class="editable-cell" id="gc-${r.id}"><span class="editable-val" onclick="editGuests(${r.id})">${r.guests ?? '—'}</span></div></td>
    <td>${evBadgeHtml(r.events)}</td>
    <td>${typeBadgeHtml(r.type)}</td>
    <td><div class="editable-cell" id="ac-${r.id}"><span class="editable-val" onclick="editAccom(${r.id})">${accomDisplay}</span></div></td>
    <td><div class="editable-cell" id="rc-${r.id}"><span class="editable-val" onclick="editRelation(${r.id})">${r.relation ? esc(r.relation) : '<span style="color:#bbb">—</span>'}</span></div></td>
    <td>
      <div class="family-radios">
        ${['Narahari','Rajaraman'].map(f => `
          <label class="family-radio-label ${r.family === f ? (f === 'Narahari' ? 'selected-N' : 'selected-R') : ''}" id="fl-${r.id}-${f}" title="${f}">
            <input type="radio" name="family-${r.id}" value="${f}" ${r.family === f ? 'checked' : ''} onchange="saveFamily(${r.id},'${f}')">
            ${f[0]}
          </label>`).join('')}
        ${r.family ? `<span style="font-size:.7rem;color:#aaa;cursor:pointer" onclick="saveFamily(${r.id},null)" title="Clear">✕</span>` : ''}
      </div>
    </td>
    <td style="text-align:center"><input type="checkbox" class="transport-cb" ${r.transportation ? 'checked' : ''} onchange="saveField(${r.id},'transportation',this.checked)"></td>
    <td style="text-align:center"><input type="checkbox" class="cant-cb" ${r.cannot_attend ? 'checked' : ''} onchange="saveCannotAttend(${r.id},this)"></td>
    <td style="color:#888;font-size:.8rem">${date}</td>
    <td><button class="del-btn" onclick="deleteRow(${r.id},this)">Delete</button></td>
  </tr>`;
}

// --- Generic patch ---
async function patchRow(id, fields) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rsvps?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'apikey': SERVICE_ROLE_KEY, 'Authorization': 'Bearer ' + SERVICE_ROLE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(fields)
  });
  if (!res.ok) throw new Error(await res.text());
  allRows = allRows.map(r => r.id === id ? { ...r, ...fields } : r);
}

async function saveField(id, field, value) {
  try { await patchRow(id, { [field]: value }); renderStats(allRows); }
  catch(e) { alert('Update failed: ' + e.message); }
}

async function saveCannotAttend(id, cb) {
  const val = cb.checked;
  try {
    await patchRow(id, { cannot_attend: val });
    const row = document.querySelector(`tr[data-id="${id}"]`);
    if (row) row.className = val ? 'cannot-attend' : '';
  } catch(e) { alert('Update failed: ' + e.message); cb.checked = !val; }
}

async function saveFamily(id, value) {
  try {
    await patchRow(id, { family: value });
    applyFilters();
  } catch(e) { alert('Update failed: ' + e.message); }
}

    `<label style="display:flex;align-items:center;gap:.35rem;font-size:.85rem;white-space:nowrap;cursor:pointer">

    `<div id="ai-${id}" style="display:flex;flex-direction:column;gap:.3rem">${checks}</div>
     <div style="display:flex;gap:.3rem;margin-top:.3rem">
       <button class="save-btn" onclick="saveAccom(${id})">Save</button>
       <button class="cancel-btn" onclick="cancelAccom(${id})">Cancel</button>
     </div>`;
}
async function saveAccom(id) {
  const container = document.getElementById('ai-' + id);
  const val = [...container.querySelectorAll('input:checked')].map(cb => cb.value);
  const btn = document.querySelector(`#ac-${id} .save-btn`); btn.disabled = true;
  try {
    await patchRow(id, { accommodation: val.length ? val : null });
    const display = val.length
      ? val.map(a => `<span style="background:#f0f0f0;padding:.1rem .4rem;border-radius:4px;font-size:.78rem;white-space:nowrap">${esc(a)}</span>`).join(' ')
      : '<span style="color:#bbb">—</span>';
    document.getElementById('ac-' + id).innerHTML = `<span class="editable-val" onclick="editAccom(${id})">${display}</span>`;
  } catch(e) { alert('Update failed: ' + e.message); btn.disabled = false; }
}
function cancelAccom(id) {
  const row = allRows.find(r => r.id === id);
  const display = row.accommodation?.length
    ? row.accommodation.map(a => `<span style="background:#f0f0f0;padding:.1rem .4rem;border-radius:4px;font-size:.78rem;white-space:nowrap">${esc(a)}</span>`).join(' ')
    : '<span style="color:#bbb">—</span>';
  document.getElementById('ac-' + id).innerHTML = `<span class="editable-val" onclick="editAccom(${id})">${display}</span>`;
}


// --- Delete ---
async function deleteRow(id, btn) {
  if (!confirm('Delete this RSVP?')) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rsvps?id=eq.' + id, {
      method: 'DELETE',
      headers: { 'apikey': SERVICE_ROLE_KEY, 'Authorization': 'Bearer ' + SERVICE_ROLE_KEY }
    });
    if (!res.ok) throw new Error(await res.text());
    allRows = allRows.filter(r => r.id !== id);
    renderStats(allRows); applyFilters();
  } catch(e) { alert('Delete failed: ' + e.message); btn.disabled = false; btn.textContent = 'Delete'; }
}

// --- Accommodation tab ---
// assignments: {"<rsvp_id>": count} — how many guests from that RSVP are in this room

function assignmentsOf(rm) { return rm.assignments || {}; }

function totalAssignedAtHotel(hotel, rsvpId) {
  return allRooms
    .filter(rm => rm.hotel === hotel)
    .reduce((s, rm) => s + (assignmentsOf(rm)[rsvpId] || 0), 0);
}

let activeHotelTab = null;

function renderAccomTab() {
  const hotelMap = {};
  ACCOM_OPTIONS.forEach(h => { hotelMap[h] = []; });
  const noAccom = [];

  allRows.forEach(r => {
    if (!r.accommodation?.length) { noAccom.push(r); return; }
    r.accommodation.forEach(h => { if (hotelMap[h]) hotelMap[h].push(r); });
  });

  // KPIs
  const totalAssignedGuests = ACCOM_OPTIONS.reduce((s, h) =>
    s + hotelMap[h].reduce((s2, r) => s2 + (+r.guests || 0), 0), 0);
  const totalRooms   = allRooms.length;
  const totalAssigned = (() => {
    const seen = new Set();
    allRooms.forEach(rm => Object.keys(assignmentsOf(rm)).forEach(id => seen.add(+id)));
    return [...seen].reduce((s, id) => {
      const r = allRows.find(x => x.id === id);
      return s + (r ? (+r.guests || 0) : 0);
    }, 0);
  })();
  const noAccomGuests = noAccom.reduce((s, r) => s + (+r.guests || 0), 0);

  document.getElementById('accomStats').innerHTML = [
    ['Total Rooms',      totalRooms],
    ['Guests w/ Hotel',  totalAssignedGuests],
    ['Placed in Rooms',  totalAssigned],
    ['No Hotel Yet',     noAccomGuests],
  ].map(([label, val]) => `
    <div class="stat">
      <div class="stat-val">${val}</div>
      <div class="stat-label">${label}</div>
    </div>`).join('');

  // Build tab bar
  const bar = document.getElementById('hotelTabsBar');
  bar.innerHTML = ACCOM_OPTIONS.map(hotel => {
    const hotelGuests = hotelMap[hotel];
    const hotelRooms  = allRooms.filter(rm => rm.hotel === hotel);
    const totalGuests = hotelGuests.reduce((s, r) => s + (+r.guests || 0), 0);
    const roomCount   = hotelRooms.length;
    const safeId      = hotel.replace(/\s/g,'_');
    return `
      <button class="hotel-tab-btn" id="htab-${safeId}" onclick="switchHotelTab('${esc(hotel)}')">
        <span class="hotel-tab-name">${esc(hotel)}</span>
        <div class="hotel-tab-stats">
          <div class="hotel-tab-stat"><div class="hotel-tab-stat-val">${totalGuests}</div><div class="hotel-tab-stat-label">Guests</div></div>
          <div class="hotel-tab-stat"><div class="hotel-tab-stat-val">${roomCount}</div><div class="hotel-tab-stat-label">Rooms</div></div>
        </div>
      </button>`;
  }).join('');

  // Build content panels
  const content = document.getElementById('hotelTabContent');
  content.innerHTML = ACCOM_OPTIONS.map(hotel => {
    const safeId = hotel.replace(/\s/g,'_');
    let inner = '';
    try { inner = buildHotelContent(hotel, hotelMap[hotel]); }
    catch(e) { inner = `<div style="padding:2rem;color:#c00">Render error: ${e.message}</div>`; console.error(hotel, e); }
    return `<div class="hotel-content" id="hcontent-${safeId}">${inner}</div>`;
  }).join('') + buildNoAccomHtml(noAccom);

  // Restore or default active tab
  const toActivate = activeHotelTab && ACCOM_OPTIONS.includes(activeHotelTab)
    ? activeHotelTab : ACCOM_OPTIONS[0];
  switchHotelTab(toActivate, true);
}

function buildHotelContent(hotel, hotelGuests) {
  const accomSearch = (document.getElementById('accomSearch')?.value || '').toLowerCase();
  const floorFilt   = document.getElementById('accomFloorFilter')?.value || '';
  const statusFilt  = document.getElementById('accomStatusFilter')?.value || '';

  const allHotelRooms = allRooms.filter(rm => rm.hotel === hotel);
  const hotelRooms = allHotelRooms.filter(rm => {
    const occupied = Object.values(assignmentsOf(rm)).reduce((s,c) => s+c, 0) > 0;
    const guestNames = Object.keys(assignmentsOf(rm)).map(rid => allRows.find(r => r.id === +rid)?.name?.toLowerCase() || '');
    if (floorFilt && rm.floor !== floorFilt) return false;
    if (statusFilt === 'occupied' && !occupied) return false;
    if (statusFilt === 'empty' && occupied) return false;
    if (accomSearch) {
      const matchRoom = rm.label?.toLowerCase().includes(accomSearch) || (rm.room_number || '').toLowerCase().includes(accomSearch);
      const matchGuest = guestNames.some(n => n.includes(accomSearch));
      if (!matchRoom && !matchGuest) return false;
    }
    return true;
  });
  const partialGuests = hotelGuests.filter(r => totalAssignedAtHotel(hotel, r.id) < (+r.guests || 0));
  const roomOptions = hotelRooms.map(rm => `<option value="${rm.id}">${esc(rm.label)}</option>`).join('');

  const sheratonSummaryHtml = hotel === 'Sheraton' && hotelRooms.length ? (() => {
    const sizeCounts = {};
    const floorCounts = {};
    for (const rm of hotelRooms) {
      const total = Object.values(assignmentsOf(rm)).reduce((s, c) => s + c, 0);
      if (total > 0) sizeCounts[total] = (sizeCounts[total] || 0) + 1;
      if (rm.floor) floorCounts[rm.floor] = (floorCounts[rm.floor] || 0) + 1;
    }
    const sizeCapacity = {3: 40, 4: 25};
    const sizePills = [3, 4].map(n => `
      <div style="display:inline-flex;flex-direction:column;align-items:center;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;padding:.4rem .9rem;min-width:70px">
        <span style="font-size:1.2rem;font-weight:700;color:#23150a">${sizeCounts[n] || 0}<span style="font-size:.8rem;font-weight:400;color:#aaa"> / ${sizeCapacity[n]}</span></span>
        <span style="font-size:.72rem;color:#888">${n}-person rooms</span>
      </div>`).join('');
    const floorCapacity = {'1st Floor':17,'2nd Floor':27,'3rd Floor':27,'4th Floor':57};
    const floorPills = ['1st Floor','2nd Floor','3rd Floor','4th Floor'].map(f => `
      <div style="display:inline-flex;flex-direction:column;align-items:center;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;padding:.4rem .9rem;min-width:70px">
        <span style="font-size:1.2rem;font-weight:700;color:#23150a">${floorCounts[f] || 0}<span style="font-size:.8rem;font-weight:400;color:#aaa"> / ${floorCapacity[f]}</span></span>
        <span style="font-size:.72rem;color:#888">${f}</span>
      </div>`).join('');
    return `<div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem;padding:.75rem .8rem;background:#fffdf8;border:1px solid #e8e0d0;border-radius:8px">
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <span style="font-size:.75rem;color:#888;white-space:nowrap">Occupancy:</span>${sizePills}
      </div>
      <div style="width:1px;background:#e8e0d0;margin:0 .25rem"></div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <span style="font-size:.75rem;color:#888;white-space:nowrap">Floors:</span>${floorPills}
      </div>
    </div>`;
  })() : '';

  const roomsHtml = hotelRooms.length
    ? hotelRooms.map(rm => {
        const asgn = assignmentsOf(rm);
        const entries = Object.entries(asgn)
          .map(([rid, cnt]) => ({ rsvp: allRows.find(r => r.id === +rid), cnt }))
          .filter(e => e.rsvp && e.cnt > 0);
        const totalInRoom = entries.reduce((s, e) => s + e.cnt, 0);

        const membersHtml = entries.length
          ? entries.map(({ rsvp: r, cnt }) => `
              <div class="room-guest-row">
                <span class="room-guest-name">${esc(r.name)}</span>
                ${r.family ? `<span class="family-badge ${r.family === 'Narahari' ? 'family-badge-N' : 'family-badge-R'}">${r.family[0]}</span>` : ''}
                <span class="room-guest-detail">${cnt}${cnt !== +r.guests ? ' of ' + r.guests : ''} guest${cnt !== 1 ? 's' : ''}</span>
                ${r.transportation ? '<span class="room-guest-detail" style="color:#2a6b2a">🚌</span>' : ''}
                <button class="remove-from-room" onclick="removeFromRoom(${rm.id},${r.id})" title="Remove">✕</button>
              </div>`).join('')
          : '<div class="room-guest-row" style="color:#bbb;font-size:.82rem;font-style:italic">Empty room</div>';

        const roomTypeHtml = hotel === 'Sheraton'
          ? `<select class="assign-select" style="max-width:95px;font-size:.75rem" onchange="saveRoomType(${rm.id},this.value)">
               <option value="">Type…</option>
               ${['Standard','Suite','Villa'].map(t => `<option value="${t}" ${rm.room_type === t ? 'selected' : ''}>${t}</option>`).join('')}
             </select>
             <select class="assign-select" style="max-width:110px;font-size:.75rem" onchange="saveRoomFloor(${rm.id},this.value)">
               <option value="">Floor…</option>
               ${['1st Floor','2nd Floor','3rd Floor','4th Floor'].map(f => `<option value="${f}" ${rm.floor === f ? 'selected' : ''}>${f}</option>`).join('')}
             </select>`
          : '';

        return `
          <div class="room-section" id="room-section-${rm.id}">
            <div class="room-header">
              <span class="room-label-val" onclick="startRenameRoom(${rm.id})" id="rl-${rm.id}" title="Click to rename">${esc(rm.label)}</span>
              ${totalInRoom > 0 ? `<span style="font-size:.75rem;color:#888">${totalInRoom} guest${totalInRoom !== 1 ? 's' : ''}</span>` : ''}

          </div>`;
      }).join('')
    : '<div class="hotel-empty" style="padding:2rem;text-align:center;color:#bbb;font-size:.875rem">No rooms yet — add one below</div>';

  const unassignedHtml = partialGuests.length ? `
    <div class="unassigned-panel">
      <div class="unassigned-panel-header">
        <span class="unassigned-panel-title">Unassigned Guests</span>
        <span class="unassigned-panel-count">${partialGuests.length} RSVP${partialGuests.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="unassigned-panel-body">
      ${partialGuests.map(r => {
        const assigned  = totalAssignedAtHotel(hotel, r.id);
        const remaining = (+r.guests || 0) - assigned;
        const key = hotel.replace(/\s/g,'_');
        return `
        <div class="unassigned-guest-row">
          <span class="unassigned-guest-name">${esc(r.name)}</span>
          <span class="room-guest-detail">${remaining} of ${r.guests} left</span>
          <input type="number" min="1" max="${remaining}" value="${remaining}"
            style="width:46px;padding:.2rem .3rem;border:1px solid #ddd;border-radius:5px;font-size:.8rem;text-align:center"
            id="split-count-${key}-${r.id}">
          <select class="assign-select" id="split-room-${key}-${r.id}">
            <option value="">Room…</option>
            ${roomOptions}
          </select>
          <button class="save-btn" style="font-size:.75rem" onclick="assignToRoom('${esc(hotel)}',${r.id})">Assign</button>
        </div>`;
      }).join('')}
      </div>
    </div>` : '';

  return `
    <div class="hotel-content-inner">
      <div class="rooms-column">
        ${sheratonSummaryHtml}
        <div class="add-room-row">
          <button class="add-room-btn" onclick="addRoom('${esc(hotel)}')">+ Add Room</button>
        </div>
        <div class="rooms-scroll-area">${roomsHtml}</div>
      </div>

function buildNoAccomHtml(noAccom) {
  if (!noAccom.length) return '';
  const total = noAccom.reduce((s, r) => s + (+r.guests || 0), 0);
  return `
    <div style="margin-top:1.5rem;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden">
      <div style="padding:.85rem 1.25rem;background:#888;color:#fff;display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:.95rem">No Accommodation Assigned</span>
        <span style="font-size:.8rem;opacity:.8">${total} guest${total !== 1 ? 's' : ''}</span>
      </div>

function switchHotelTab(hotel, skipSave) {
  if (!skipSave) activeHotelTab = hotel;
  const safeId = hotel.replace(/\s/g,'_');
  document.querySelectorAll('.hotel-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.hotel-content').forEach(p => p.classList.remove('active'));

  const panel = document.getElementById('hcontent-' + safeId);
  if (btn) btn.classList.add('active');
  if (panel) panel.classList.add('active');
  if (!skipSave) activeHotelTab = hotel;
}

// --- Room API helpers ---
async function apiRoom(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/room_groups' + path, {
    method,
    headers: {
      'apikey': SERVICE_ROLE_KEY, 'Authorization': 'Bearer ' + SERVICE_ROLE_KEY,
      'Content-Type': 'application/json', 'Prefer': 'return=representation'
    },
    body: body != null ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// Create a new room for a hotel
async function addRoom(hotel) {
  const label = prompt('Room name:', 'Room ' + (allRooms.filter(r => r.hotel === hotel).length + 1));
  if (!label) return;
  try {
    const created = await apiRoom('POST', '', { hotel, label, assignments: {} });
    allRooms.push(Array.isArray(created) ? created[0] : created);
    renderAccomTab();
  } catch(e) { alert('Failed to create room: ' + e.message); }
}

// Delete a room group
async function deleteRoomGroup(id) {
  if (!confirm('Delete this room?')) return;
  try {
    await apiRoom('DELETE', '?id=eq.' + id, null);
    allRooms = allRooms.filter(r => r.id !== id);
    renderAccomTab();
  } catch(e) { alert('Failed to delete room: ' + e.message); }
}

// Rename room — inline edit
function startRenameRoom(id) {
  const rm = allRooms.find(r => r.id === id);
  const span = document.getElementById('rl-' + id);
  const header = span.parentElement;
  span.style.display = 'none';
  const input = document.createElement('input');
  input.className = 'room-label-input';
  input.value = rm.label;
  const save = document.createElement('button');
  save.className = 'save-btn'; save.textContent = 'Save';
  const cancel = document.createElement('button');
  cancel.className = 'cancel-btn'; cancel.textContent = 'Cancel';

  header.insertBefore(input, span);
  header.insertBefore(save, span);
  header.insertBefore(cancel, span);
  input.focus();

  const finish = () => { input.remove(); save.remove(); cancel.remove(); span.style.display = ''; };
  cancel.onclick = finish;
  save.onclick = async () => {
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    save.disabled = true;
    try {
      await apiRoom('PATCH', '?id=eq.' + id, { label: val });
      allRooms = allRooms.map(r => r.id === id ? { ...r, label: val } : r);
      span.textContent = val;
      finish();
    } catch(e) { alert('Failed to rename: ' + e.message); save.disabled = false; }
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') cancel.click(); });
}

// Assign N guests from an RSVP to a room
async function assignToRoom(hotel, rsvpId) {
  const key = hotel.replace(/\s/g, '_');
  const roomId = parseInt(document.getElementById('split-room-' + key + '-' + rsvpId)?.value);
  const count  = parseInt(document.getElementById('split-count-' + key + '-' + rsvpId)?.value);
  if (!roomId || !count || count < 1) return;

  const rm = allRooms.find(r => r.id === roomId);
  if (!rm) return;

  const rsvp = allRows.find(r => r.id === rsvpId);
  const remaining = (+rsvp?.guests || 0) - totalAssignedAtHotel(hotel, rsvpId);
  if (count > remaining) { alert(`Only ${remaining} guest${remaining !== 1 ? 's' : ''} remaining to assign.`); return; }

  const newAsgn = { ...assignmentsOf(rm), [rsvpId]: (assignmentsOf(rm)[rsvpId] || 0) + count };
  try {
    await apiRoom('PATCH', '?id=eq.' + roomId, { assignments: newAsgn });
    allRooms = allRooms.map(r => r.id === roomId ? { ...r, assignments: newAsgn } : r);
    renderAccomTab();
  } catch(e) { alert('Failed to assign: ' + e.message); }
}

// Remove all of an RSVP's guests from a room
async function removeFromRoom(roomId, rsvpId) {
  const rm = allRooms.find(r => r.id === roomId);
  if (!rm) return;
  const newAsgn = { ...assignmentsOf(rm) };
  delete newAsgn[rsvpId];
  try {
    await apiRoom('PATCH', '?id=eq.' + roomId, { assignments: newAsgn });
    allRooms = allRooms.map(r => r.id === roomId ? { ...r, assignments: newAsgn } : r);
    renderAccomTab();
  } catch(e) { alert('Failed to remove: ' + e.message); }
}

// Save room type (Sheraton only)
async function saveRoomNumber(id, value) {
  try {
    await apiRoom('PATCH', '?id=eq.' + id, { room_number: value || null });
    allRooms = allRooms.map(r => r.id === id ? { ...r, room_number: value || null } : r);

async function saveRoomFloor(id, value) {

    renderAccomTab();

}

async function saveRoomType(id, value) {
  try {
    await apiRoom('PATCH', '?id=eq.' + id, { room_type: value || null });
    allRooms = allRooms.map(r => r.id === id ? { ...r, room_type: value || null } : r);
  } catch(e) { alert('Failed to save room type: ' + e.message); }
}

async function submitAddRSVP() {
  const name = document.getElementById('ar-name').value.trim();
  const guests = parseInt(document.getElementById('ar-guests').value);
  if (!name) { document.getElementById('ar-name').focus(); return; }
  if (!guests || guests < 1) { document.getElementById('ar-guests').focus(); return; }

  const events = document.getElementById('ar-events').value || null;
  const type = document.getElementById('ar-type').value || null;
  const accom = [...document.querySelectorAll('.ar-accom:checked')].map(cb => cb.value);
  const transportation = document.getElementById('ar-transport').checked;
  const relation = document.getElementById('ar-relation').value || null;
  const family = document.getElementById('ar-family').value || null;
  const phone = document.getElementById('ar-phone').value.trim() || null;

  const btn = document.getElementById('ar-submit');
  btn.disabled = true;
  btn.textContent = 'Adding…';

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rsvps', {
      method: 'POST',
      headers: {
        'apikey': SERVICE_ROLE_KEY,
        'Authorization': 'Bearer ' + SERVICE_ROLE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ name, phone, guests, events, type, accommodation: accom.length ? accom : null, transportation, relation, family })
    });
    if (!res.ok) throw new Error(await res.text());
    const [newRow] = await res.json();
    allRows = [newRow, ...allRows];
    renderStats(allRows);
    applyFilters();
    closeAddRSVP();
  } catch(e) {
    alert('Failed to add RSVP: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Add RSVP';
  }
}

// Close modal on overlay click
document.getElementById('addRsvpModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAddRSVP();
});

function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(cell => {
    const s = cell == null ? '' : String(cell);
    return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportRSVPs() {
  const header = ['Name','Mobile','Guests','Events','Invite Type','Accommodation','Relation','Family','Transport','Cannot Attend','Submitted Date'];
  const rows = allRows.map(r => [
    r.name,
    r.phone || '',
    r.guests,
    Array.isArray(r.events) ? r.events.join('; ') : (r.events || ''),
    r.type || '',
    Array.isArray(r.accommodation) ? r.accommodation.join('; ') : (r.accommodation || ''),
    r.relation || '',
    r.family || '',
    r.transportation ? 'Yes' : 'No',
    r.cannot_attend ? 'Yes' : 'No',
    r.created_at ? new Date(r.created_at).toLocaleDateString() : ''
  ]);
  downloadCSV('rsvps.csv', [header, ...rows]);
}

function exportAccommodation() {
  const header = ['Hotel','Room','Room Number','Floor','Room Type','Guest Name','Guests Assigned','Transport'];
  const rows = [];
  const hotels = [...new Set(allRooms.map(r => r.hotel))];
  for (const hotel of hotels) {
    const hotelRooms = allRooms.filter(r => r.hotel === hotel);
    for (const rm of hotelRooms) {
      const asgn = assignmentsOf(rm);
      const entries = Object.entries(asgn);
      if (entries.length === 0) {
        rows.push([hotel, rm.label, rm.room_number || '', rm.floor || '', rm.room_type || '', '', '', '']);
      } else {
        for (const [rsvpId, count] of entries) {
          const rsvp = allRows.find(r => r.id === parseInt(rsvpId));
          rows.push([
            hotel,
            rm.label,
            rm.room_number || '',
            rm.floor || '',
            rm.room_type || '',
            rsvp ? rsvp.name : 'Unknown',
            count,
            rsvp?.transportation ? 'Yes' : 'No'
          ]);
        }
      }
    }
  }
  downloadCSV('accommodation.csv', [header, ...rows]);
}
